services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      TRAINER_ADDR: trainer:50051
    depends_on:
      trainer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    shm_size: 2gb
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import grpc, sys;
          from grpc_health.v1 import health_pb2, health_pb2_grpc;
          stub = health_pb2_grpc.HealthStub(grpc.insecure_channel('localhost:50051'));
          reply = stub.Check(health_pb2.HealthCheckRequest(), timeout=3);
          sys.exit(0 if reply.status == health_pb2.HealthCheckResponse.SERVING else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./datasets:/data/datasets:ro
      - ./models:/data/models
      - ./pretrained:/data/pretrained:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: frontend
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
