[project]
name = "yolox-trainer"
version = "0.1.0"
description = "gRPC trainer service for YOLOX-Tiny finetuning"
requires-python = ">=3.10,<3.11"
dependencies = [
    "grpcio==1.84.0",
    "grpcio-health-checking==1.84.0",
    "protobuf==7.36.2",
    "numpy<2",
    "pycocotools",
]

[project.optional-dependencies]
engine = [
    "torch==2.8.*",
    "torchvision==0.23.*",
    "yolox",
    "opencv-python-headless",
    "loguru",
    "tabulate",
    "psutil",
    "tqdm",
    "thop",
    "tensorboard",
    "ninja",
    "setuptools",
    "wheel",
]

[dependency-groups]
dev = ["pytest", "grpcio-tools==1.84.0"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
no-build-isolation-package = ["yolox"]

[[tool.uv.dependency-metadata]]
name = "yolox"
version = "0.3.0"
requires-dist = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
yolox = { git = "https://github.com/Megvii-BaseDetection/YOLOX", rev = "6ddff4824372906469a7fae2dc3206c7aa4bbaee" }

[tool.pytest.ini_options]
testpaths = ["tests"]
